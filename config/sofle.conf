CONFIG_EC11=y
CONFIG_EC11_TRIGGER_GLOBAL_THREAD=y

CONFIG_ZMK_SLEEP=y
CONFIG_ZMK_IDLE_SLEEP_TIMEOUT=900000

CONFIG_BT_CTLR_TX_PWR_PLUS_8=y
CONFIG_ZMK_KEYBOARD_NAME="SofleChoc59"

CONFIG_ZMK_POINTING=y

# RGB: drives all 30 LEDs per half (per-key + underglow) as one strip
CONFIG_ZMK_RGB_UNDERGLOW=y
CONFIG_WS2812_STRIP=y
# cap brightness to stay within the nice!nano regulator's current budget
CONFIG_ZMK_RGB_UNDERGLOW_BRT_MAX=50
CONFIG_ZMK_RGB_UNDERGLOW_BRT_START=30
CONFIG_ZMK_RGB_UNDERGLOW_ON_START=y
# LEDs only on while USB power is present (each half checks its own USB port).
# AUTO_OFF_IDLE is intentionally not set: it shares state with AUTO_OFF_USB and
# would turn the LEDs back on when waking from idle on battery.
CONFIG_ZMK_RGB_UNDERGLOW_AUTO_OFF_USB=y
# keep external power (nice!view) on when RGB is toggled off
CONFIG_ZMK_RGB_UNDERGLOW_EXT_POWER=n

# --- USB / KVM compatibility ---
# Boot protocol lets a KVM's HID port talk to the keyboard in its simple mode.
CONFIG_ZMK_USB_BOOT=y
# 6KRO is the boot-keyboard-compatible report format (NKRO breaks many KVMs/BIOSes).
CONFIG_ZMK_HID_REPORT_TYPE_HKRO=y
CONFIG_ZMK_HID_KEYBOARD_REPORT_SIZE=6

# ZMK Studio is NOT enabled here: it adds a USB serial (CDC) interface that many
# KVMs reject. build.yaml has a separate "with_studio" left-half build for remapping.

# TEMPORARY DIAGNOSTIC: ZMK normally waits 60 s before saving settings to flash.
# The keyboard drops off USB ~60 s after connecting; if that moves to ~10 s with
# this line, the settings save is the trigger. Remove after testing.
CONFIG_ZMK_SETTINGS_SAVE_DEBOUNCE=10000
